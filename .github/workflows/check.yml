name: Local synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start -- --runtime native --eager > /tmp/filesdigi-stack.log 2>&1
      - run: npm run db:env
      - run: npm run db:types && git diff --exit-code -- src/lib/database.types.ts
      - run: npm run check
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - if: always()
        run: npm run db:stop
